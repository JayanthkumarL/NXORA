<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226 226" width="100%" height="100%">
  <style>
    .mark-dark { display: block; }
    .mark-light { display: none; }
    @media (prefers-color-scheme: dark) {
      .mark-dark { display: none; }
      .mark-light { display: block; }
    }
  </style>
  <image class="mark-dark" width="226" height="226" href="data:image/png;base64," />
  <image class="mark-light" width="226" height="226" href="data:image/png;base64," />
</svg>